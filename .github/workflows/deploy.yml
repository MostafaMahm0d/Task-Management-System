name: Deploy

on:
    push:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest

        services:
            mysql:
                image: mysql:8.4
                env:
                    MYSQL_ALLOW_EMPTY_PASSWORD: yes
                    MYSQL_DATABASE: task_management_system
                ports:
                    - 3306:3306
                options: >-
                    --health-cmd="mysqladmin ping"
                    --health-interval=5s
                    --health-timeout=5s
                    --health-retries=10

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: "8.4"
                  extensions: mbstring, pdo_mysql, redis, gd, zip
                  coverage: none

            - name: Copy .env
              run: cp .env.example .env

            - name: Install Composer dependencies
              run: composer install --no-interaction --prefer-dist --optimize-autoloader

            - name: Generate app key
              run: php artisan key:generate

            - name: Set test database env
              run: |
                  php artisan config:clear
              env:
                  DB_CONNECTION: mysql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 3306
                  DB_DATABASE: task_management_system
                  DB_USERNAME: root
                  DB_PASSWORD: ""

            - name: Run migrations
              run: php artisan migrate --force
              env:
                  DB_CONNECTION: mysql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 3306
                  DB_DATABASE: task_management_system
                  DB_USERNAME: root
                  DB_PASSWORD: ""

            - name: Run tests
              run: php artisan test
              env:
                  DB_CONNECTION: mysql
                  DB_HOST: 127.0.0.1
                  DB_PORT: 3306
                  DB_DATABASE: task_management_system
                  DB_USERNAME: root
                  DB_PASSWORD: ""

    deploy:
        needs: test
        runs-on: ubuntu-latest
        if: github.ref == 'refs/heads/main'

        steps:
            - name: Configure SSH agent
              uses: webfactory/ssh-agent@v0.9.0
              with:
                  ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

            - name: Add server to known_hosts
              run: ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

            - name: Deploy over SSH
              run: |
                  ssh ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
                    set -e
                    cd /root/Task-Management-System
                    sudo git fetch origin main
                    sudo git reset --hard origin/main
                    sudo docker compose exec -T app composer install --no-dev --optimize-autoloader
                    sudo docker compose exec -T app npm ci
                    sudo docker compose exec -T app npm run build
                    sudo docker compose exec -T app php artisan migrate --force
                    sudo docker compose exec -T app php artisan config:cache
                    sudo docker compose exec -T app php artisan route:cache
                    sudo docker compose up -d --build
                  '

name: task-management-system

services:
    app:
        restart: unless-stopped

    webserver:
        restart: unless-stopped
        ports:
            - "80:80"
            - "443:443"
        volumes:
            - ./docker/certbot/conf:/etc/letsencrypt
            - ./docker/certbot/www:/var/www/certbot

    mysql:
        restart: unless-stopped

    phpmyadmin:
        restart: unless-stopped
        ports:
            - "127.0.0.1:${FORWARD_PHPMYADMIN_PORT:-8080}:80"

    certbot:
        image: certbot/certbot
        container_name: tms_certbot
        volumes:
            - ./docker/certbot/conf:/etc/letsencrypt
            - ./docker/certbot/www:/var/www/certbot